name: Build and Push Docker Images (Trusted)

# Only the customized `web` image is built. The caddy and l4-port-manager
# images are taken from upstream.

on:
  push:
    branches:
      - develop
  workflow_dispatch:

# A newer build supersedes any build still in progress.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ingressi-web

jobs:
  build-and-push:
    # arm64 is disabled for now. To enable it later, build on the native runner
    # `ubuntu-24.04-arm` (no QEMU) with `platforms: linux/arm64`, push by digest,
    # and merge both digests into one manifest.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=web
          # Export only final-image layers to limit Actions cache storage.
          cache-to: type=gha,mode=min,scope=web
          platforms: linux/amd64
          sbom: false
          provenance: false
