name: Upstream sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force Docker image build even if already up to date"
        required: false
        type: boolean
        default: false

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Sync upstream branch and tags
        id: sync
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: ingres-si/ingressi
          BRANCH: develop
        run: |
          set -euo pipefail
          echo "Syncing with upstream repository via GitHub API..."
          response=$(gh api --method POST repos/${{ github.repository }}/merge-upstream -f branch="$BRANCH")
          echo "$response"
          merge_type=$(echo "$response" | jq -r '.merge_type // "none"')
          echo "merge_type=${merge_type}" >> "$GITHUB_OUTPUT"

          # Sync upstream tags
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || true
          git fetch upstream --tags
          git push origin --tags || true

      - name: Trigger Docker image build
        if: steps.sync.outputs.merge_type != 'none' || inputs.force_build == true
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Triggering Build and Push Docker Images (Trusted)..."
          gh workflow run docker-build-trusted.yml --repo "${{ github.repository }}" --ref develop
          echo "Successfully triggered Build and Push Docker Images (Trusted)."
