name: Upstream sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force Docker image build even if already up to date"
        required: false
        type: boolean
        default: false

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # UPSTREAM_SYNC_TOKEN (PAT) is required to assign issues to Copilot.
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BRANCH: develop
    steps:
      - name: Sync from upstream
        id: sync
        run: |
          set -uo pipefail
          # merge-upstream follows the fork's parent repository.
          if response=$(gh api --method POST "repos/${GH_REPO}/merge-upstream" -f branch="$BRANCH" 2>&1); then
            echo "$response"
            echo "merge_type=$(echo "$response" | jq -r '.merge_type // "none"')" >> "$GITHUB_OUTPUT"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          elif echo "$response" | grep -qi "conflict"; then
            echo "$response"
            echo "merge_type=none" >> "$GITHUB_OUTPUT"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          else
            echo "$response"
            exit 1
          fi

      - name: Ask Copilot to resolve merge conflict
        if: steps.sync.outputs.conflict == 'true'
        run: |
          set -euo pipefail
          title="Resolve upstream merge conflict"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Issue #$existing already open; skipping."
            exit 0
          fi
          upstream=$(gh api "repos/${GH_REPO}" --jq '.parent.full_name')
          body="Merging \`${upstream}@${BRANCH}\` into \`${BRANCH}\` conflicts.

          Merge upstream \`${BRANCH}\` into this repository's \`${BRANCH}\` and resolve all conflicts.
          Follow \`.github/agents/upstream-maintainer.agent.md\` and keep the features listed in \`.upstream/protected-features.md\`.
          Keep changes minimal. Do not touch \`.github/workflows/**\`. Open a PR targeting \`${BRANCH}\`."
          gh issue create --title "$title" --body "$body" --assignee "@copilot"

      - name: Trigger Docker image build
        if: steps.sync.outputs.merge_type != 'none' || inputs.force_build == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docker-build-trusted.yml --ref "$BRANCH"
