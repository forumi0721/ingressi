name: Upstream sync

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      conflict: ${{ steps.sync.outputs.conflict }}
      branch: ${{ steps.sync.outputs.branch }}
      candidate_sha: ${{ steps.sync.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Fetch upstream and prepare candidate
        id: sync
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          UPSTREAM_REPOSITORY: ingres-si/ingressi
          UPSTREAM_BRANCH: develop
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "UPSTREAM_SYNC_TOKEN is required so generated branches, PRs, and tags trigger normal workflows."
            exit 1
          fi
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream "${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}" --tags
          git fetch origin "${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"

          upstream_sha="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"
          echo "candidate_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$upstream_sha" "origin/${BASE_BRANCH}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="sync/upstream-${upstream_sha:0:12}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

          open_pr="$(gh pr list --head "$branch" --base "$BASE_BRANCH" --state open --json number --jq 'length')"
          if [ "$open_pr" != "0" ]; then
            echo "An existing sync PR was found; validating it again."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "A stale sync branch already exists without an open PR; stopping for review."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git switch --create "$branch" "origin/${BASE_BRANCH}"

          if git merge --no-edit "$upstream_sha"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            git push origin "$branch"
          else
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open clean sync pull request
        if: steps.sync.outputs.changed == 'true' && steps.sync.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          BRANCH: ${{ steps.sync.outputs.branch }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          if ! gh pr list --head "$BRANCH" --base "$BASE_BRANCH" --state open --json number --jq 'length' | grep -q '^0$'; then
            exit 0
          fi
          gh pr create --base "$BASE_BRANCH" --head "$BRANCH" \
            --title "Sync upstream ${UPSTREAM_SHA:0:12}" \
            --body "Automated upstream sync candidate from ingres-si/ingressi@${UPSTREAM_SHA}. The candidate will be merged only after protected-path policy and isolated validation pass."

  resolve-conflict:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true' && needs.prepare.outputs.conflict == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Check protected-path and change-size policy
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/ingres-si/ingressi.git
          git fetch origin "$BASE_BRANCH"
          git fetch upstream develop --tags
          bash .upstream/check-policy.sh "origin/${BASE_BRANCH}" "$UPSTREAM_SHA"

      - name: Merge and resolve conflicts with Copilot CLI
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
        run: |
          set -euo pipefail
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "COPILOT_GITHUB_TOKEN is required for Copilot CLI in a personal repository."
            exit 1
          fi
          git switch --create "$BRANCH" "origin/${BASE_BRANCH}"
          if git merge --no-commit --no-ff "$UPSTREAM_SHA"; then
            echo "The merge is now clean; no AI edits were needed."
          else
            npm install --global @github/copilot
            max_attempts="$(ruby -ryaml -e 'puts YAML.load_file(".upstream/policy.yml")["sync"]["max_ai_attempts"]')"
            for attempt in $(seq 1 "$max_attempts"); do
              copilot -p "Resolve only the currently conflicted files in this upstream merge. Read .upstream/protected-features.md and .github/agents/upstream-maintainer.agent.md first. Preserve downstream behavior and upstream behavior. Do not modify protected paths, tests, workflows, credentials, or unrelated files. Do not claim tests passed. Leave conflict resolutions unstaged, with all conflict markers removed. If safe resolution is not clear, stop without guessing. Attempt ${attempt} of ${max_attempts}." \
                --allow-tool='shell(git status:*, git diff:*, git show:*, git ls-files:*)' --allow-tool=write --no-ask-user
              if ! git diff --name-only --diff-filter=U | grep -q .; then
                break
              fi
            done
          fi

      - name: Validate and push AI conflict resolution
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
        run: |
          set -euo pipefail
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Copilot left unresolved merge conflicts."
            exit 1
          fi
          if git diff --name-only | grep -E '^(tests/|\.github/workflows/|\.github/agents/|\.upstream/|AGENTS\.md$)'; then
            echo "AI modified a protected path."
            exit 1
          fi
          git add -u
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Merge upstream ${UPSTREAM_SHA:0:12}"
          git push origin "$BRANCH"
          if ! gh pr list --head "$BRANCH" --base "$BASE_BRANCH" --state open --json number --jq 'length' | grep -q '^0$'; then
            exit 0
          fi
          gh pr create --base "$BASE_BRANCH" --head "$BRANCH" \
            --title "Sync upstream ${UPSTREAM_SHA:0:12} (AI conflict resolution)" \
            --body "Copilot CLI resolved merge conflicts for upstream ingres-si/ingressi@${UPSTREAM_SHA}. Separate deterministic validation and protected-path gates are required before merge."

  validate-and-merge:
    needs: [prepare, resolve-conflict]
    if: >-
      always() && needs.prepare.outputs.changed == 'true' &&
      (needs.prepare.outputs.conflict == 'false' || needs.resolve-conflict.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      branch: ${{ needs.prepare.outputs.branch }}
    steps:
      - name: Find sync pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          number="$(gh pr list --head "$BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number')"
          if [ -z "$number" ] || [ "$number" = null ]; then
            echo "No sync PR was created; refusing to validate or merge."
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/merge
          fetch-depth: 0

      - name: Validate protected paths and change size
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_BRANCH"
          git show "origin/${BASE_BRANCH}:.upstream/policy.yml" > "$RUNNER_TEMP/upstream-policy.yml"
          git show "origin/${BASE_BRANCH}:.upstream/check-policy.sh" > "$RUNNER_TEMP/check-upstream-policy.sh"
          UPSTREAM_POLICY_FILE="$RUNNER_TEMP/upstream-policy.yml" \
            bash "$RUNNER_TEMP/check-upstream-policy.sh" "origin/${BASE_BRANCH}" HEAD

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Unit and integration tests
        run: bun run test

      - name: Production build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          DATABASE_PATH: /tmp/ingressi-build.db
          DATABASE_URL: file:/tmp/ingressi-build.db
          SESSION_SECRET: ci-build-session-secret-at-least-32-chars
          ADMIN_PASSWORD: ci-build-admin-password
        run: bun --bun run build

      - name: Build Docker images (no push)
        run: |
          for service in web caddy l4-port-manager; do
            docker build --file "docker/${service}/Dockerfile" --build-arg APP_VERSION=upstream-sync --tag "ingressi-${service}:validation" .
          done

  merge-release:
    needs: [prepare, validate-and-merge]
    if: needs.prepare.outputs.changed == 'true' && needs.validate-and-merge.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Enable auto-merge and wait for merge
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          PR_NUMBER: ${{ needs.validate-and-merge.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
          for _ in $(seq 1 720); do
            state="$(gh pr view "$PR_NUMBER" --json state --jq '.state')"
            if [ "$state" = MERGED ]; then exit 0; fi
            sleep 20
          done
          echo "Auto-merge is waiting on repository branch rules or required checks."
          exit 1

      - name: Create custom release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          PR_NUMBER: ${{ needs.validate-and-merge.outputs.pr_number }}
        run: |
          set -euo pipefail
          git fetch origin --tags
          git remote add upstream https://github.com/ingres-si/ingressi.git
          git fetch upstream --tags
          upstream_version="$(git tag --list 'v[0-9]*' --sort=-version:refname | grep -v '-' | head -n 1 | sed 's/^v//')"
          if [ -z "$upstream_version" ]; then
            echo "No stable upstream vX.Y.Z tag exists; refusing to invent a release version."
            exit 1
          fi
          prefix="v${upstream_version}-custom."
          next="$(git tag --list "${prefix}*" | sed "s/^${prefix}//" | awk '/^[0-9]+$/ { if ($1 > max) max=$1 } END { print max + 1 }')"
          tag="${prefix}${next}"
          commit="$(gh pr view "$PR_NUMBER" --json mergeCommit --jq '.mergeCommit.oid')"
          git tag -a "$tag" "$commit" -m "Ingressi ${tag}"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Wait for Docker image publishing
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --workflow docker-build-trusted.yml --branch "$TAG" --event push --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "No trusted Docker build was triggered by tag push."
            exit 1
          fi
          gh run watch "$run_id" --exit-status

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          sbom_run=""
          for _ in $(seq 1 30); do
            sbom_run="$(gh run list --workflow release-sbom.yml --branch "$TAG" --event push --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$sbom_run" ] && break
            sleep 10
          done
          if [ -n "$sbom_run" ]; then gh run watch "$sbom_run" --exit-status; fi
          if [ -z "$sbom_run" ]; then
            echo "No SBOM release workflow was triggered by tag push."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft=false --title "Ingressi $TAG"
          else
            gh release create "$TAG" --verify-tag --title "Ingressi $TAG" --generate-notes
          fi

  report-blocked:
    needs: [prepare, resolve-conflict, validate-and-merge, merge-release]
    if: >-
      always() && needs.prepare.outputs.changed == 'true' &&
      (needs.resolve-conflict.result == 'failure' || needs.validate-and-merge.result == 'failure' || needs.merge-release.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open a maintainer review issue
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          title="Upstream sync blocked: ${UPSTREAM_SHA:0:12}"
          if gh issue list --state open --search "$title in:title" --json number --jq 'length' | grep -q '^0$'; then
            gh issue create --title "$title" --body "Automated upstream sync stopped at conflict resolution, policy validation, tests, auto-merge, or release publishing. Review the Upstream sync workflow run before taking action. No unchecked code was intentionally merged.\n\nUpstream commit: ingres-si/ingressi@${UPSTREAM_SHA}"
          fi
